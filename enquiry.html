<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Enquiry Form - Money Making Machine Trading</title><meta name="description" content="Enquire about forex course, crypto signals, mentorship. Calculate price."><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="css/style.css"></head><body><h1>Enquiry Form - Trading Services</h1><form id="enquiryForm" action="https://formspree.io/f/xaykqweq" method="POST"><label>Full Name:</label><input type="text" id="name" name="name" required minlength="3" placeholder="Enter your name"><span class="error" id="nameError"></span><label>Email:</label><input type="email" id="email" name="email" required><span class="error" id="emailError"></span><label>WhatsApp Number:</label><input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required placeholder="0712345678"><span class="error" id="phoneError"></span><label>Service:</label><select id="service" name="service" required><option value="">--Choose--</option><option value="forex-course">Forex Beginners Course - R500</option><option value="crypto-signals">Crypto Signals - R300/month</option><option value="mentorship">Stock Mentorship - R1000</option><option value="ebook">Trading E-book - R150</option><option value="sponsor">Sponsor Student - R500</option></select><label>Quantity / Months:</label><input type="number" id="quantity" name="quantity" min="1" value="1" required><label>Start Date:</label><input type="date" id="date" name="date" required><button type="submit">Calculate Total Cost</button></form><div id="result" style="margin-top:20px;padding:15px;background:#e8f5e9;border:1px solid green;display:none;"></div><script src="js/main.js"></script><script>document.getElementById('enquiryForm').addEventListener('submit',function(e){e.preventDefault();let name=document.getElementById('name').value;let phone=document.getElementById('phone').value;let qty=document.getElementById('quantity').value;let service=document.getElementById('service').value;let valid=true;document.getElementById('nameError').innerText="";document.getElementById('phoneError').innerText="";if(name.length<3){document.getElementById('nameError').innerText="Name must be more than 3 letters";valid=false;}if(phone.length!=10){document.getElementById('phoneError').innerText="Phone must be 10 digits";valid=false;}if(valid){let price=0;if(service==="forex-course")price=500;if(service==="crypto-signals")price=300;if(service==="mentorship")price=1000;if(service==="ebook")price=150;if(service==="sponsor")price=500;let total=qty*price;let r=document.getElementById('result');r.style.display="block";r.innerHTML="<h3>Hi "+name+"</h3><p>Service: "+service+"</p><p>Total: R"+total+"</p><p>We will WhatsApp you on "+phone+"</p>";fetch(this.action,{method:'POST',body:new FormData(this),headers:{'Accept':'application/json'}}).then(()=>alert("Enquiry sent!"));}});</script></body></html>
